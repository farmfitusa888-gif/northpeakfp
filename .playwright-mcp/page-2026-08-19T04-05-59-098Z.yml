      - text: › Cook County Property Tax Appeals
    - generic [ref=f2e25]:
      - paragraph [ref=f2e26]: North suburbs · Guide
      - 'heading "Cook County Property Tax Appeals: What North Suburban Business Owners Should Know" [level=1] [ref=f2e27]'
    - generic [ref=f2e29]:
      - paragraph [ref=f2e30]: If your business owns the building it operates from — or you are on a lease that passes the property tax through to you — the Cook County reassessment cycle is one of the few large, predictable costs you can actually do something about. Most owners find out about it after the bill arrives, which is the one point in the process where the options are worst.
      - heading "The cycle is fixed, and every town we work in is on the same one" [level=2] [ref=f2e31]
      - paragraph [ref=f2e32]: Cook County does not reassess everything at once. It splits the county into three groups — the City of Chicago, the north and northwest suburbs, and the south and west suburbs — and reassesses one group each year, so any given property is reassessed every three years.
      - paragraph [ref=f2e33]:
        - text: Every Cook County community in our service area sits in the
        - strong [ref=f2e34]: north suburban group
        - text: ": Wilmette, Evanston, Skokie, Glenview, Northbrook, Winnetka, Morton Grove, Niles and Park Ridge. That group was reassessed in 2016, 2019, 2022 and 2025, which puts the next one in"
        - strong [ref=f2e35]: "2028"
        - text: . If you own property in any of those towns, you are on the same clock as every one of your neighbours.
      - heading "Why the year matters more than most people expect" [level=2] [ref=f2e36]
      - paragraph [ref=f2e37]:
        - text: "In a reassessment year you get two separate opportunities to contest a value: first with the"
        - link "Assessor's office" [ref=f2e38] [cursor=pointer]:
          - /url: https://www.cookcountyassessoril.gov/
        - text: ", and then, independently, with the"
        - link "Board of Review" [ref=f2e39] [cursor=pointer]:
          - /url: https://www.cookcountyboardofreview.com/
        - text: . In an off year you generally get one — the Board of Review window only.
      - paragraph [ref=f2e40]: Both windows are short, they open by township rather than county-wide, and they do not move because you were busy. That is the entire practical argument for knowing which year you are in before it arrives rather than after.
      - heading "What actually moves an assessment" [level=2] [ref=f2e41]
      - paragraph [ref=f2e42]: "An appeal is an evidence exercise, not an argument about whether taxes are too high. The grounds that tend to matter:"
      - list [ref=f2e43]:
        - listitem [ref=f2e44]:
          - strong [ref=f2e45]: Comparable properties.
          - text: Similar buildings, assessed lower. This is the most common basis and the most work.
        - listitem [ref=f2e46]:
          - strong [ref=f2e47]: Factual error.
          - text: The record says your building is bigger than it is, or the wrong class, or counts space that no longer exists. These are the cleanest cases.
        - listitem [ref=f2e48]:
          - strong [ref=f2e49]: Vacancy.
          - text: For income-producing commercial property that sat empty, documented occupancy matters.
      - paragraph [ref=f2e50]: "All three depend on records you either have or do not have. That is where a bookkeeping problem quietly becomes a tax problem: if your fixed asset schedule, lease documents and occupancy history are a mess, the evidence is expensive to assemble under a deadline."
      - heading "Where we help, and where we stop" [level=2] [ref=f2e51]
      - paragraph [ref=f2e52]: "We are accountants, not attorneys. We do not file property tax appeals and we do not act as counsel. What we do is the part that sits upstream of the filing: keeping the fixed asset and lease records in a state where evidence can actually be pulled from them, modelling what a given assessment change does to your cash position across the year, and telling you plainly whether the amount at stake justifies the cost of pursuing it. When a filing is worth making, we will say so and point you to a property tax attorney — several work in these townships specifically."
      - paragraph [ref=f2e53]:
        - text: Illinois also runs a state-level
        - link "Property Tax Appeal Board" [ref=f2e54] [cursor=pointer]:
          - /url: http://www.ptab.illinois.gov/getstarted.html
        - text: for owners who want to go further than the county Board of Review.
