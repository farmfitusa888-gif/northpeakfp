    - generic [ref=e108]:
      - generic [ref=e109]:
        - heading "Two details worth knowing" [level=2] [ref=e110]
        - paragraph [ref=e111]: Both come up more often than you would think, and both change the answer to a simple question.
      - generic [ref=e113]:
        - generic [ref=e114]:
          - generic [ref=e115]: "01"
          - heading "Wheeling is split down the middle" [level=3] [ref=e116]
          - paragraph [ref=e117]: "Lake Cook Road is the line. South of it, assessment runs through the Cook County Assessor and the Cook County Treasurer collects. North of it, Lake County's Chief County Assessment Office and Treasurer handle it. The village publishes the sales tax consequence too: the Cook portion carries a 10% total rate and the Lake portion 8%. If you sell taxable goods in Wheeling, which side of that road your counter sits on is a real number on your return."
          - link "Village source →" [ref=e118] [cursor=pointer]:
            - /url: https://www.wheelingil.gov/245/Sales-Tax
        - generic [ref=e119]:
          - generic [ref=e120]: "02"
          - heading "Glenview sits in three townships" [level=3] [ref=e121]
          - paragraph [ref=e122]: New Trier, Niles and Northfield all cover parts of the village. Two businesses on opposite sides of Glenview can fall into different township assessment groups, so a reassessment year for one is not automatically a reassessment year for the other. Worth confirming by parcel rather than by village name.
    - generic [ref=e125]:
      - heading "Not on the list?" [level=2] [ref=e127]
      - generic [ref=e128]:
