        - heading "Registering a business in Wheeling" [level=2] [ref=e36]
        - paragraph [ref=e37]: Every village on the North Shore sets its own rule, and they diverge more than most owners expect.
      - generic [ref=e38]:
        - paragraph [ref=e39]:
          - text: Wheeling requires a valid Business Certificate under its municipal code
          - strong [ref=e40]: before operations begin
          - text: ", on a licence year running May 1 to April 30. Two practical details:"
          - strong [ref=e41]: home-based businesses do not need the licence
          - text: ", though some need a zoning certificate from Community Development — and the village advises a"
          - strong [ref=e42]: minimum six-week processing time
          - text: ", which is by some distance the longest lead time in this group. If you are signing a lease in Wheeling, start this before you need it."
        - paragraph [ref=e43]:
          - link "Wheeling's own guidance →" [ref=e44] [cursor=pointer]:
            - /url: https://www.wheelingil.gov/2046/Business-License
          - text: · Requirements and fees change; confirm with the village before you rely on this.
    - generic [ref=e47]:
      - generic [ref=e48]:
        - heading "Property assessment in Wheeling" [level=2] [ref=e49]
        - paragraph [ref=e50]: Worth knowing before you assume the rules are the same everywhere in the north suburbs. They are not.
      - paragraph [ref=e52]:
        - text: Wheeling is genuinely split, and the dividing line is
        - strong [ref=e53]: Lake Cook Road
        - text: ". South of it, assessment runs through the Cook County Assessor and taxes are collected by the Cook County Treasurer. North of it, the Lake County Chief County Assessment Office handles assessment and the Lake County Treasurer collects. The village publishes this split itself, along with the sales tax consequence: the"
        - link "Cook portion carries a 10% total sales tax rate and the Lake portion 8% — which side of the road you are on is a real number on your return →" [ref=e54] [cursor=pointer]:
          - /url: /service-areas/wheeling-sales-tax-lake-cook-road
    - generic [ref=e56]:
