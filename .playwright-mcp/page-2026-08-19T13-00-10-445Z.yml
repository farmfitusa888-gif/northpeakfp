        - generic [ref=e59]: Wheeling
      - generic [ref=e60]:
        - generic [ref=e61]:
          - generic [ref=e62]: Q
          - heading "Do I need a business licence to operate in Wheeling?" [level=3] [ref=e63]
          - paragraph [ref=e64]: "Wheeling requires a valid Business Certificate under its municipal code before operations begin, on a licence year running May 1 to April 30. Two practical details: home-based businesses do not need the licence, though some need a zoning certificate from Community Development &mdash; and the village advises a minimum six-week processing time, which is by some distance the longest lead time in this group. If you are signing a lease in Wheeling, start this before you need it."
        - generic [ref=e65]:
          - generic [ref=e66]: Q
          - heading "Which county and township handle assessment for a Wheeling business?" [level=3] [ref=e67]
          - paragraph [ref=e68]: Wheeling is in Cook and Lake County, Wheeling Township (Cook) and Vernon Township (Lake). That decides who values your property, which appeal window applies, and who you call first — and it is not the same answer a few miles away.
